<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="880" height="400" fill="#fbfbfd"/>

  <text x="48" y="52" font-size="21" font-weight="600" fill="#1d1d1f">Agents propose. The checker decides. The runtime confines.</text>
  <text x="48" y="76" font-size="13.5" fill="#86868b">No program runs unless every effect is declared, recoverable, and within its granted authority.</text>

  <g text-anchor="middle">
    <g filter="url(#s)">
      <rect x="48"  y="110" width="168" height="96" rx="18" fill="#ffffff" stroke="#e5e5ea"/>
      <rect x="258" y="110" width="200" height="96" rx="18" fill="#0071e3"/>
      <rect x="500" y="110" width="168" height="96" rx="18" fill="#ffffff" stroke="#e5e5ea"/>
      <rect x="710" y="110" width="122" height="96" rx="18" fill="#ffffff" stroke="#e5e5ea"/>
    </g>
    <text x="132" y="138" font-size="11" font-weight="600" fill="#86868b">AI AGENT</text>
    <text x="132" y="162" font-size="12.5" fill="#1d1d1f">writes an ENTOLI</text>
    <text x="132" y="179" font-size="12.5" fill="#1d1d1f">program from a</text>
    <text x="132" y="196" font-size="12.5" fill="#1d1d1f">one-page spec</text>

    <text x="358" y="138" font-size="11" font-weight="600" fill="#bcd9f7">CHECKER — THE BOUNDARY</text>
    <text x="358" y="162" font-size="12.5" fill="#ffffff">every effect declared + handled</text>
    <text x="358" y="179" font-size="12.5" fill="#ffffff">every tool call recoverable</text>
    <text x="358" y="196" font-size="12.5" fill="#ffffff">nothing beyond the granted set</text>

    <text x="584" y="138" font-size="11" font-weight="600" fill="#86868b">RUNTIME</text>
    <text x="584" y="162" font-size="12.5" fill="#1d1d1f">grants capabilities,</text>
    <text x="584" y="179" font-size="12.5" fill="#1d1d1f">journals every step,</text>
    <text x="584" y="196" font-size="12.5" fill="#1d1d1f">executes the handlers</text>

    <text x="771" y="138" font-size="11" font-weight="600" fill="#86868b">WORLD</text>
    <text x="771" y="162" font-size="12.5" fill="#1d1d1f">models, tools,</text>
    <text x="771" y="179" font-size="12.5" fill="#1d1d1f">payments, human</text>
    <text x="771" y="196" font-size="12.5" fill="#1d1d1f">approvals</text>
  </g>

  <g stroke="#d2d2d7" stroke-width="1.5" fill="#d2d2d7">
    <line x1="216" y1="158" x2="250" y2="158"/><polygon points="250,154.5 258,158 250,161.5"/>
    <line x1="458" y1="158" x2="492" y2="158"/><polygon points="492,154.5 500,158 492,161.5"/>
    <line x1="668" y1="158" x2="702" y2="158"/><polygon points="702,154.5 710,158 702,161.5"/>
  </g>
  <text x="479" y="148" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d8a3e">valid</text>

  <path d="M 358 206 L 358 236 L 132 236 L 132 210" fill="none" stroke="#ff453a" stroke-width="1.5"/>
  <polygon points="128.5,210 132,202 135.5,210" fill="#ff453a"/>
  <text x="245" y="229" text-anchor="middle" font-size="11.5" fill="#ff453a">invalid — diagnostics return to the agent, which repairs and retries</text>

  <g filter="url(#s)">
    <rect x="500" y="252" width="168" height="74" rx="18" fill="#1d1d1f"/>
  </g>
  <text x="584" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#86868b">DURABLE STORE</text>
  <text x="584" y="298" text-anchor="middle" font-size="12.5" fill="#f5f5f7">journal + continuations</text>
  <text x="584" y="315" text-anchor="middle" font-size="12.5" fill="#ff9f0a">zero authority inside</text>
  <g stroke="#d2d2d7" stroke-width="1.5" fill="#d2d2d7">
    <line x1="568" y1="206" x2="568" y2="244"/><polygon points="564.5,244 568,252 571.5,244"/>
    <line x1="600" y1="252" x2="600" y2="214"/><polygon points="596.5,214 600,206 603.5,214"/>
  </g>
  <text x="700" y="285" font-size="11.5" fill="#86868b">survives kill −9,</text>
  <text x="700" y="301" font-size="11.5" fill="#86868b">reboot, redeploy</text>

  <text x="48" y="368" font-size="13.5" fill="#1d1d1f"><tspan font-weight="600">Measured:</tspan> over an adversarial task set, closed-book model-written programs never violated the semantic</text>
  <text x="48" y="388" font-size="13.5" fill="#1d1d1f">restrictions in any checked generation. The rules are learnable from one page.</text>
</svg>
