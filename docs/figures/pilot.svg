<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="880" height="360" fill="#fbfbfd"/>

  <text x="48" y="52" font-size="21" font-weight="600" fill="#1d1d1f">The pilot, as it ran.</text>
  <text x="48" y="76" font-size="13.5" fill="#86868b">An agent drafted with a real model, waited for a real human, died in the middle — and acted exactly once.</text>

  <line x1="80" y1="236" x2="800" y2="236" stroke="#e5e5ea" stroke-width="2"/>

  <g text-anchor="middle">
    <g filter="url(#s)">
      <rect x="54"  y="112" width="136" height="80" rx="16" fill="#ffffff" stroke="#e5e5ea"/>
      <rect x="216" y="112" width="156" height="80" rx="16" fill="#1d1d1f"/>
      <rect x="520" y="112" width="136" height="80" rx="16" fill="#ffffff" stroke="#e5e5ea"/>
      <rect x="682" y="112" width="150" height="80" rx="16" fill="#ffffff" stroke="#e5e5ea"/>
    </g>
    <text x="122" y="138" font-size="11" font-weight="600" fill="#0071e3">RUN</text>
    <text x="122" y="160" font-size="12" fill="#1d1d1f">the model drafts</text>
    <text x="122" y="176" font-size="12" fill="#1d1d1f">the brief, cached</text>

    <text x="294" y="138" font-size="11" font-weight="600" fill="#ff9f0a">SUSPEND</text>
    <text x="294" y="160" font-size="12" fill="#f5f5f7">“pending human approval”</text>
    <text x="294" y="176" font-size="12" fill="#f5f5f7">the process exits</text>

    <text x="588" y="138" font-size="11" font-weight="600" fill="#ff9f0a">APPROVE</text>
    <text x="588" y="160" font-size="12" fill="#1d1d1f">one command records</text>
    <text x="588" y="176" font-size="12" fill="#1d1d1f">the human decision</text>

    <text x="757" y="138" font-size="11" font-weight="600" fill="#1d8a3e">RECOVER</text>
    <text x="757" y="160" font-size="12" fill="#1d1d1f">resumes cold, publishes,</text>
    <text x="757" y="176" font-size="12" fill="#1d1d1f">returns the receipt</text>

    <circle cx="122" cy="236" r="6" fill="#0071e3"/>
    <circle cx="294" cy="236" r="6" fill="#ff9f0a"/>
    <circle cx="588" cy="236" r="6" fill="#ff9f0a"/>
    <circle cx="757" cy="236" r="6" fill="#34c759"/>
    <g stroke="#d2d2d7" stroke-width="1" stroke-dasharray="3,3">
      <line x1="122" y1="192" x2="122" y2="228"/>
      <line x1="294" y1="192" x2="294" y2="228"/>
      <line x1="588" y1="192" x2="588" y2="228"/>
      <line x1="757" y1="192" x2="757" y2="228"/>
    </g>

    <rect x="396" y="222" width="116" height="28" rx="14" fill="#ffffff" stroke="#e5e5ea"/>
    <text x="454" y="240" font-size="11.5" fill="#86868b">hours or days…</text>
  </g>

  <g font-size="11.5" text-anchor="middle">
    <text x="208" y="276" font-weight="600" fill="#ff453a">kill −9 anywhere here?</text>
    <text x="208" y="292" fill="#86868b">recovers — no second model spend</text>
    <text x="672" y="276" font-weight="600" fill="#ff453a">recover twice? crash mid-publish?</text>
    <text x="672" y="292" fill="#86868b">still exactly one publication</text>
  </g>

  <text x="48" y="332" font-size="13.5" fill="#1d1d1f"><tspan font-weight="600">Guaranteed by the type system and the journal</tspan> — not by anyone being careful.</text>
</svg>
