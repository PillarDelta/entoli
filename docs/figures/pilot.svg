<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="880" height="400" rx="20" fill="#161617"/>

  <text x="48" y="58" font-size="22" font-weight="600" fill="#f5f5f7">The pilot, as it ran.</text>
  <text x="48" y="84" font-size="13.5" fill="#a1a1a6">An agent drafted with a real model, waited for a real human, died in the middle — and acted exactly once.</text>

  <!-- four equal cards on one row: w=170, x = 48, 252, 508, 712? keep gap for elapsed pill: x = 48, 244, 516, 712 -->
  <g>
    <rect x="48"  y="122" width="170" height="96" rx="14" fill="#26262a" stroke="#3a3a3e"/>
    <rect x="244" y="122" width="170" height="96" rx="14" fill="#26262a" stroke="#ff9f0a"/>
    <rect x="516" y="122" width="170" height="96" rx="14" fill="#26262a" stroke="#3a3a3e"/>
    <rect x="712" y="122" width="120" height="96" rx="14" fill="#0f3d23" stroke="#30d158"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="1.2">
    <text x="133" y="148" fill="#0a84ff">RUN</text>
    <text x="329" y="148" fill="#ff9f0a">SUSPEND</text>
    <text x="601" y="148" fill="#8e8e93">APPROVE</text>
    <text x="772" y="148" fill="#30d158">RECOVER</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#f5f5f7">
    <text x="133" y="172">the model drafts the</text>
    <text x="133" y="189">brief — cached, so it</text>
    <text x="133" y="206">is never paid twice</text>
    <text x="329" y="172">“pending human</text>
    <text x="329" y="189">approval” — then</text>
    <text x="329" y="206">the process exits</text>
    <text x="601" y="172">one command</text>
    <text x="601" y="189">records the</text>
    <text x="601" y="206">human decision</text>
    <text x="772" y="172">resumes cold,</text>
    <text x="772" y="189">publishes once,</text>
    <text x="772" y="206">returns a receipt</text>
  </g>

  <!-- timeline -->
  <line x1="80" y1="258" x2="800" y2="258" stroke="#2c2c2e" stroke-width="2"/>
  <circle cx="133" cy="258" r="5.5" fill="#0a84ff"/>
  <circle cx="329" cy="258" r="5.5" fill="#ff9f0a"/>
  <circle cx="601" cy="258" r="5.5" fill="#ff9f0a"/>
  <circle cx="772" cy="258" r="5.5" fill="#30d158"/>
  <g stroke="#3a3a3e" stroke-width="1" stroke-dasharray="3,3">
    <line x1="133" y1="218" x2="133" y2="250"/>
    <line x1="329" y1="218" x2="329" y2="250"/>
    <line x1="601" y1="218" x2="601" y2="250"/>
    <line x1="772" y1="218" x2="772" y2="250"/>
  </g>
  <rect x="408" y="244" width="114" height="28" rx="14" fill="#26262a" stroke="#3a3a3e"/>
  <text x="465" y="262" text-anchor="middle" font-size="11" fill="#a1a1a6">hours or days…</text>

  <g text-anchor="middle" font-size="11.5">
    <text x="231" y="298" font-weight="600" fill="#ff6961">kill −9 anywhere here?</text>
    <text x="231" y="315" fill="#a1a1a6">recovers — no second model spend</text>
    <text x="686" y="298" font-weight="600" fill="#ff6961">recover twice? crash mid-publish?</text>
    <text x="686" y="315" fill="#a1a1a6">still exactly one publication</text>
  </g>

  <line x1="48" y1="344" x2="832" y2="344" stroke="#2c2c2e"/>
  <text x="48" y="372" font-size="12.5" fill="#a1a1a6"><tspan font-weight="600" fill="#f5f5f7">Guaranteed by the type system and the journal</tspan> — not by anyone being careful.</text>
</svg>
