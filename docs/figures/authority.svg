<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="880" height="380" fill="#fbfbfd"/>

  <text x="48" y="52" font-size="21" font-weight="600" fill="#1d1d1f">Authority at rest.</text>
  <text x="48" y="76" font-size="13.5" fill="#86868b">A sleeping agent carries data — never power. Steal it, copy it, archive it: there is nothing inside to use.</text>

  <g text-anchor="middle">
    <g filter="url(#s)">
      <rect x="48"  y="104" width="232" height="168" rx="18" fill="#ffffff" stroke="#e5e5ea"/>
      <rect x="324" y="104" width="232" height="168" rx="18" fill="#1d1d1f"/>
      <rect x="600" y="104" width="232" height="168" rx="18" fill="#ffffff" stroke="#e5e5ea"/>
    </g>

    <text x="164" y="132" font-size="11" font-weight="600" fill="#86868b">RUNNING</text>
    <text x="164" y="158" font-size="13" fill="#1d1d1f">program + state,</text>
    <text x="164" y="176" font-size="13" fill="#1d1d1f">waiting on an approval</text>
    <rect x="76" y="196" width="176" height="30" rx="15" fill="#e8f2ff"/>
    <text x="164" y="215" font-size="12" font-weight="600" fill="#0071e3">capability · Ledger · budget 5</text>
    <text x="164" y="252" font-size="11.5" fill="#86868b">authority lives in the runtime only</text>

    <text x="440" y="132" font-size="11" font-weight="600" fill="#86868b">AT REST — DISK OR IN TRANSIT</text>
    <text x="440" y="158" font-size="13" fill="#f5f5f7">saved continuation, journal,</text>
    <text x="440" y="176" font-size="13" fill="#f5f5f7">data (classification computed)</text>
    <rect x="352" y="196" width="176" height="30" rx="15" fill="#3a3a3c"/>
    <text x="440" y="215" font-size="12" font-weight="600" fill="#ff9f0a">slot: “needs Ledger” — no key</text>
    <text x="440" y="252" font-size="11.5" font-weight="600" fill="#ff453a">zero authority inside</text>

    <text x="716" y="132" font-size="11" font-weight="600" fill="#86868b">RESUMED</text>
    <text x="716" y="158" font-size="13" fill="#1d1d1f">the same computation,</text>
    <text x="716" y="176" font-size="13" fill="#1d1d1f">exactly where it stopped</text>
    <rect x="628" y="196" width="176" height="30" rx="15" fill="#e8faed"/>
    <text x="716" y="215" font-size="12" font-weight="600" fill="#1d8a3e">re-granted under today’s policy</text>
    <text x="716" y="245" font-size="11.5" fill="#86868b">smaller budget — binds to it</text>
    <text x="716" y="261" font-size="11.5" fill="#86868b">revoked — refusal, by name</text>
  </g>

  <g stroke="#d2d2d7" stroke-width="1.5" fill="#d2d2d7">
    <line x1="280" y1="188" x2="316" y2="188"/><polygon points="316,184.5 324,188 316,191.5"/>
    <line x1="556" y1="188" x2="592" y2="188"/><polygon points="592,184.5 600,188 592,191.5"/>
  </g>
  <text x="302" y="178" text-anchor="middle" font-size="11" fill="#86868b">suspend</text>
  <text x="578" y="178" text-anchor="middle" font-size="11" fill="#86868b">resume</text>

  <text x="48" y="320" font-size="13.5" fill="#1d1d1f"><tspan font-weight="600">Revocation needs no protocol.</tspan>  There is nothing on disk to revoke — a withdrawn grant simply cannot be</text>
  <text x="48" y="340" font-size="13.5" fill="#1d1d1f">found at resume, and every dependent sleeping agent halts. Authority can never outlive its justification.</text>
</svg>
