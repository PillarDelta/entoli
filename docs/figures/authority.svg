<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="880" height="400" rx="20" fill="#161617"/>

  <text x="48" y="58" font-size="22" font-weight="600" fill="#f5f5f7">Authority at rest.</text>
  <text x="48" y="84" font-size="13.5" fill="#a1a1a6">A sleeping agent carries data — never power. Steal it, copy it, archive it: there is nothing inside to use.</text>

  <!-- three equal panels: w=240, x = 48, 320, 592 -->
  <g>
    <rect x="48"  y="122" width="240" height="160" rx="14" fill="#26262a" stroke="#3a3a3e"/>
    <rect x="320" y="122" width="240" height="160" rx="14" fill="#000000" stroke="#3a3a3e"/>
    <rect x="592" y="122" width="240" height="160" rx="14" fill="#26262a" stroke="#3a3a3e"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="1.2">
    <text x="168" y="150" fill="#8e8e93">RUNNING</text>
    <text x="440" y="150" fill="#8e8e93">AT REST · DISK OR TRANSIT</text>
    <text x="712" y="150" fill="#8e8e93">RESUMED</text>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#f5f5f7">
    <text x="168" y="176">program + state,</text>
    <text x="168" y="194">waiting on an approval</text>
    <text x="440" y="176">saved continuation, journal,</text>
    <text x="440" y="194">classified data</text>
    <text x="712" y="176">the same computation,</text>
    <text x="712" y="194">exactly where it stopped</text>
  </g>
  <rect x="76" y="214" width="184" height="28" rx="14" fill="#102a43"/>
  <text x="168" y="232" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64b5ff">capability · Ledger · budget 5</text>
  <rect x="348" y="214" width="184" height="28" rx="14" fill="#2b1d10"/>
  <text x="440" y="232" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ff9f0a">slot: “needs Ledger” — no key</text>
  <rect x="620" y="214" width="184" height="28" rx="14" fill="#0f3d23"/>
  <text x="712" y="232" text-anchor="middle" font-size="11.5" font-weight="600" fill="#30d158">re-granted under today’s policy</text>
  <g text-anchor="middle" font-size="11" fill="#a1a1a6">
    <text x="168" y="264">authority lives in the runtime only</text>
    <text x="440" y="264" font-weight="600" fill="#ff6961">zero authority inside</text>
    <text x="712" y="264">revoked? refusal, by name</text>
  </g>

  <g stroke="#48484c" stroke-width="1.5" fill="#48484c">
    <line x1="288" y1="202" x2="312" y2="202"/><polygon points="312,198.5 320,202 312,205.5"/>
    <line x1="560" y1="202" x2="584" y2="202"/><polygon points="584,198.5 592,202 584,205.5"/>
  </g>
  <text x="304" y="190" text-anchor="middle" font-size="10" fill="#8e8e93">suspend</text>
  <text x="576" y="190" text-anchor="middle" font-size="10" fill="#8e8e93">resume</text>

  <line x1="48" y1="316" x2="832" y2="316" stroke="#2c2c2e"/>
  <text x="48" y="344" font-size="12.5" fill="#a1a1a6"><tspan font-weight="600" fill="#f5f5f7">Revocation needs no protocol.</tspan> There is nothing on disk to revoke — a withdrawn grant simply cannot be found</text>
  <text x="48" y="364" font-size="12.5" fill="#a1a1a6">at resume, and every dependent sleeping agent halts. Authority can never outlive its justification.</text>
</svg>
