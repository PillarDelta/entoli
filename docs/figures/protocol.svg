<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="880" height="400" fill="#fbfbfd"/>

  <text x="48" y="52" font-size="21" font-weight="600" fill="#1d1d1f">One tool call, crash-safe at every step.</text>
  <text x="48" y="76" font-size="13.5" fill="#86868b">The five-step effect protocol. Only the green steps touch the durable journal — atomically.</text>

  <g text-anchor="middle">
    <g filter="url(#s)">
      <rect x="48" y="108" width="140" height="92" rx="16" fill="#ffffff" stroke="#e5e5ea"/>
      <rect x="208" y="108" width="150" height="92" rx="16" fill="#ffffff" stroke="#e5e5ea"/>
      <rect x="378" y="108" width="140" height="92" rx="16" fill="#ffffff" stroke="#e5e5ea"/>
      <rect x="538" y="108" width="140" height="92" rx="16" fill="#ffffff" stroke="#e5e5ea"/>
      <rect x="698" y="108" width="134" height="92" rx="16" fill="#ffffff" stroke="#e5e5ea"/>
    </g>
    <g font-size="11" font-weight="600">
      <text x="118" y="132" fill="#34c759">1 · INTEND · DURABLE</text>
      <text x="283" y="132" fill="#ff9f0a">2 · INVOKE</text>
      <text x="448" y="132" fill="#ff9f0a">3 · RECEIVE</text>
      <text x="608" y="132" fill="#34c759">4 · COMMIT · DURABLE</text>
      <text x="765" y="132" fill="#0071e3">5 · RESUME</text>
    </g>
    <g font-size="12" fill="#1d1d1f">
      <text x="118" y="155">intent + continuation</text>
      <text x="118" y="171">saved first, in one</text>
      <text x="118" y="187">transaction</text>
      <text x="283" y="155">the handler clause runs;</text>
      <text x="283" y="171">its foreign call is the</text>
      <text x="283" y="187">only world contact</text>
      <text x="448" y="155">the result arrives,</text>
      <text x="448" y="171">in volatile</text>
      <text x="448" y="187">memory only</text>
      <text x="608" y="155">one in-place write:</text>
      <text x="608" y="171">Pending becomes</text>
      <text x="608" y="187">Done(result)</text>
      <text x="765" y="155">the program</text>
      <text x="765" y="171">continues — at most</text>
      <text x="765" y="187">once per run</text>
    </g>
  </g>
  <g stroke="#d2d2d7" stroke-width="1.5" fill="#d2d2d7">
    <line x1="188" y1="154" x2="202" y2="154"/><polygon points="202,150.5 208,154 202,157.5"/>
    <line x1="358" y1="154" x2="372" y2="154"/><polygon points="372,150.5 378,154 372,157.5"/>
    <line x1="518" y1="154" x2="532" y2="154"/><polygon points="532,150.5 538,154 532,157.5"/>
    <line x1="678" y1="154" x2="692" y2="154"/><polygon points="692,150.5 698,154 692,157.5"/>
  </g>

  <line x1="208" y1="222" x2="678" y2="222" stroke="#ff453a" stroke-width="1.5"/>
  <line x1="208" y1="216" x2="208" y2="222" stroke="#ff453a" stroke-width="1.5"/>
  <line x1="678" y1="216" x2="678" y2="222" stroke="#ff453a" stroke-width="1.5"/>
  <text x="443" y="242" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ff453a">the crash window — the process may die anywhere here</text>

  <g filter="url(#s)">
    <rect x="48" y="266" width="784" height="56" rx="16" fill="#ffffff" stroke="#e5e5ea"/>
  </g>
  <text x="72" y="289" font-size="12" font-weight="600" fill="#1d1d1f">The durable journal</text>
  <text x="72" y="307" font-size="12" fill="#86868b">recovery reads this, and nothing else</text>
  <rect x="268" y="281" width="270" height="26" rx="13" fill="#fff4e6"/>
  <text x="403" y="298" text-anchor="middle" font-size="12" fill="#c93400">Pending · operation · delivery class · witness</text>
  <rect x="556" y="281" width="120" height="26" rx="13" fill="#e8faed"/>
  <text x="616" y="298" text-anchor="middle" font-size="12" fill="#1d8a3e">Done · result</text>
  <text x="700" y="298" font-size="12" fill="#86868b">nothing is ever lost</text>

  <text x="48" y="356" font-size="13" fill="#1d1d1f"><tspan font-weight="600">Recovery is decided, not guessed.</tspan>  Before 1: never attempted — rerun.  Inside the window: Pending — re-invoke</text>
  <text x="48" y="376" font-size="13" fill="#1d1d1f">by its declared delivery class, same witness, the service deduplicates.  After 4: Done — deliver the result, never repeat.</text>
</svg>
